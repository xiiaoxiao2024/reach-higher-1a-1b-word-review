:root{--navy:#163a5f;--blue:#2f6f9f;--blue-soft:#e8f2f8;--gold:#b98428;--gold-soft:#fff2d6;--green:#1e7650;--green-soft:#e7f5ed;--red:#b44238;--red-soft:#fbe9e7;--ink:#172331;--muted:#667587;--line:#d8e1e8;--paper:#fff;--bg:#edf3f7;font-family:"Hiragino Sans GB",Aptos,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#173e67 0,#245b86 260px,var(--bg) 260px);color:var(--ink);min-height:100vh} button{font:inherit} .wrap{max-width:1120px;margin:auto;padding:24px 16px 64px}

.audio-card,.panel{background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 30px #122b4120} .audio-card{padding:16px;margin-bottom:14px} .audio-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px} .step{font-weight:850;color:var(--navy)} .pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-size:12px;font-weight:750} audio{width:100%} .audio-note,.pending{font-size:13px;line-height:1.55;color:var(--muted);margin:9px 0 0} .pending{padding:12px;background:#fff7e6;border:1px solid #efd49e;border-radius:10px;color:#7b5717}
.layout{display:grid;grid-template-columns:310px 1fr;gap:14px;align-items:start} .panel-head{padding:15px;border-bottom:1px solid var(--line)} .panel-title{margin:0;font-size:18px} .panel-sub{margin:5px 0 0;color:var(--muted);font-size:13px} .word-list{max-height:650px;overflow:auto;padding:8px;display:grid;gap:7px} .word-item{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 11px;text-align:left;cursor:pointer} .word-item.active{border-color:var(--blue);background:var(--blue-soft)} .word-item strong{display:flex;align-items:center;justify-content:space-between;gap:8px} .inline-speaker{font-size:16px;color:var(--blue);margin:0} .word-item span{display:block;color:var(--muted);font-size:12px;margin-top:3px}

.face{border:1px solid var(--line);border-radius:13px;background:linear-gradient(180deg,#fff,#fbfcfd);padding:20px;min-height:330px} .meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px} .word-heading{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:5px} .word{font-size:clamp(34px,7vw,50px);line-height:1.08;margin:0;color:var(--navy)} .speak{min-height:42px;border:1px solid var(--blue);background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:9px 14px;cursor:pointer;font-weight:850} .speak.playing{background:var(--blue);color:#fff} .pos{color:var(--muted);margin-bottom:16px} .definition{font-size:19px;line-height:1.55;margin:0 0 12px} .chinese{font-size:16px;color:var(--blue);margin:0 0 12px} .example{color:var(--muted);line-height:1.6;margin:0} .controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px} .primary,.secondary{min-height:42px;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:800} .primary{background:var(--blue);color:#fff;border:1px solid var(--blue)} .secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}

<script type="application/json" id="wordData">[{"word": "Old", "pos": "adj.", "definition": "from a long time ago; not new", "chinese": "", "example": "Old phones had long cords.", "type": "Key Word", "cloze": "_____ phones had long cords.", "direct_cloze": true, "audio": "../audio/1b/Word_Review_Ava_US_V1/old_c00dbbc9.mp3"}, {"word": "New", "pos": "adj.", "definition": "made or found recently; not old", "chinese": "", "example": "New phones can fit in a pocket.", "type": "Key Word", "cloze": "_____ phones can fit in a pocket.", "direct_cloze": true, "audio": "../audio/1b/Word_Review_Ava_US_V1/new_c2a6b03f.mp3"}, {"word": "record", "pos": "n.", "definition": "a round disk used to play music", "chinese": "", "example": "A record can play music.", "type": "Key Word", "cloze": "A _____ can play music.", "direct_cloze": true, "audio": "../audio/1b/Word_Review_Ava_US_V1/record_275a7000.mp3"}, {"word": "music", "pos": "n.", "definition": "sounds people sing, play, or listen to", "chinese": "", "example": "We dance to music.", "type": "Key Word", "cloze": "We dance to _____.", "direct_cloze": true, "audio": "../audio/1b/Word_Review_Ava_US_V1/music_3a01be17.mp3"}, {"word": "better", "pos": "adj.", "definition": "more useful or nicer than another", "chinese": "", "example": "I think the new song is better.", "type": "Key Word", "cloze": "I think the new song is _____.", "direct_cloze": true, "audio": "../audio/1b/Word_Review_Ava_US_V1/better_a31e44e0.mp3"}, {"word": "easier", "pos": "adj.", "definition": "not as hard to do", "chinese": "", "example": "This small bag is easier to carry.", "type": "Key Word", "cloze": "This small bag is _____ to carry.", "direct_cloze": true, "audio": "../audio/1b/Word_Review_Ava_US_V1/easier_61bd7e6e.mp3"}, {"word": "build", "pos": "v.", "definition": "to make something by putting parts together", "chinese": "", "example": "We build a tower with blocks.", "type": "Key Word", "cloze": "We _____ a tower with blocks.", "direct_cloze": true, "audio": "../audio/1b/Word_Review_Ava_US_V1/build_80754af9.mp3"}, {"word": "invent", "pos": "v.", "definition": "to make something new for the first time", "chinese": "", "example": "People invent new tools.", "type": "Key Word", "cloze": "People _____ new tools.", "direct_cloze": true, "audio": "../audio/1b/Word_Review_Ava_US_V1/invent_1e489c2d.mp3"}, {"word": "machine", "pos": "n.", "definition": "something with parts that helps do work", "chinese": "", "example": "This machine washes dishes.", "type": "Key Word", "cloze": "This _____ washes dishes.", "direct_cloze": true, "audio": "../audio/1b/Word_Review_Ava_US_V1/machine_7817c52b.mp3"}, {"word": "modern", "pos": "adj.", "definition": "from today, not long ago", "chinese": "", "example": "This is a modern phone.", "type": "Key Word", "cloze": "This is a _____ phone.", "direct_cloze": true, "audio": "../audio/1b/Word_Review_Ava_US_V1/modern_b09be85d.mp3"}, {"word": "tool", "pos": "n.", "definition": "something used to do a job", "chinese": "", "example": "A hammer is a tool.", "type": "Key Word", "cloze": "A hammer is a _____.", "direct_cloze": true, "audio": "../audio/1b/Word_Review_Ava_US_V1/tool_1937c4c2.mp3"}, {"word": "yard sale", "pos": "n.", "definition": "a time when people sell used things outside a home", "chinese": "", "example": "We sell old toys at a yard sale.", "type": "Challenge Word", "cloze": "We sell old toys at a _____.", "direct_cloze": true, "audio": "../audio/1b/Word_Review_Ava_US_V1/yard_sale_9b92ed3e.mp3"}, {"word": "shook her head", "pos": "v. phr.", "definition": "moved her head side to side to mean no", "chinese": "", "example": "Nell shook her head to mean no.", "type": "Challenge Word", "cloze": "Nell _____ to mean no.", "direct_cloze": true, "audio": "../audio/1b/Word_Review_Ava_US_V1/shook_her_head_072fbc39.mp3"}, {"word": "back then", "pos": "adv. phr.", "definition": "at that time in the past", "chinese": "", "example": "Phones were big back then.", "type": "Challenge Word", "cloze": "Phones were big _____.", "direct_cloze": true, "audio": "../audio/1b/Word_Review_Ava_US_V1/back_then_1f7d7274.mp3"}, {"word": "photo albums", "pos": "n.", "definition": "books that hold photographs", "chinese": "", "example": "We keep family pictures in photo albums.", "type": "Challenge Word", "cloze": "We keep family pictures in _____.", "direct_cloze": true, "audio": "../audio/1b/Word_Review_Ava_US_V1/photo_albums_4d910c26.mp3"}, {"word": "turned up the music", "pos": "v. phr.", "definition": "made the music louder", "chinese": "", "example": "Max turned up the music.", "type": "Challenge Word", "cloze": "Max _____.", "direct_cloze": true, "audio": "../audio/1b/Word_Review_Ava_US_V1/turned_up_the_music_466629da.mp3"}, {"word": "burn them onto a music player", "pos": "v. phr.", "definition": "copy the songs onto a music player", "chinese": "", "example": "Max can burn them onto a music player.", "type": "Challenge Word", "cloze": "Max can _____.", "direct_cloze": true, "audio": "../audio/1b/Word_Review_Ava_US_V1/burn_them_onto_a_music_player_e3165b19.mp3"}, {"word": "gasped", "pos": "v.", "definition": "took a quick breath because she was surprised", "chinese": "", "example": "Nell gasped when she heard “burn.”", "type": "Challenge Word", "cloze": "Nell _____ when she heard “burn.”", "direct_cloze": true, "audio": "../audio/1b/Word_Review_Ava_US_V1/gasped_7763548a.mp3"}, {"word": "groaned", "pos": "v.", "definition": "made a low sound because he was upset", "chinese": "", "example": "Max groaned and began to explain.", "type": "Challenge Word", "cloze": "Max _____ and began to explain.", "direct_cloze": true, "audio": "../audio/1b/Word_Review_Ava_US_V1/groaned_20246351.mp3"}, {"word": "plugged it into the wall", "pos": "v. phr.", "definition": "put the plug in so it could get power", "chinese": "", "example": "Nell plugged it into the wall.", "type": "Challenge Word", "cloze": "Nell _____.", "direct_cloze": true, "audio": "../audio/1b/Word_Review_Ava_US_V1/plugged_it_into_the_wall_6c3ac8aa.mp3"}, {"word": "neat", "pos": "adj.", "definition": "nice or interesting", "chinese": "", "example": "Max thinks the old player is neat.", "type": "Challenge Word", "cloze": "Max thinks the old player is _____.", "direct_cloze": true, "audio": "../audio/1b/Word_Review_Ava_US_V1/neat_4a95dcc4.mp3"}]</script>
<script>
const WORDS=JSON.parse(document.getElementById('wordData').textContent),STORE='rh-1b-u7-w3-4-v1';
let current=0,quiz=0,mode='card';let state=JSON.parse(localStorage.getItem(STORE)||'{"correct":0,"tried":0,"missed":[]}');
const list=document.getElementById('wordList'),root=document.getElementById('reviewRoot'),score=document.getElementById('scoreText'),queue=document.getElementById('queueText'),bar=document.getElementById('progressFill');
document.getElementById('listSub').textContent=`${WORDS.length} words · ${WORDS.filter(w=>w.type==='Key Word').length} Key · ${WORDS.filter(w=>w.type==='Challenge Word').length} Challenge · Tap a word to listen`;
function save(){localStorage.setItem(STORE,JSON.stringify(state))} function shuffle(a){a=a.slice();for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function update(){score.textContent=`${state.correct} correct / ${state.tried} tried`;queue.textContent=state.missed.length?`${state.missed.length} missed word(s) saved`:'No missed words yet';bar.style.width=`${Math.min(100,state.tried/(WORDS.length*2)*100)}%`;save()}
const wordPlayer=new Audio();function playWord(w,button){wordPlayer.pause();wordPlayer.currentTime=0;wordPlayer.src=w.audio;document.querySelectorAll('.speak.playing').forEach(x=>x.classList.remove('playing'));if(button)button.classList.add('playing');wordPlayer.onended=()=>button&&button.classList.remove('playing');wordPlayer.onerror=()=>{if(button)button.classList.remove('playing');alert('Word audio could not be opened. Keep the task card and audio folder together.');};wordPlayer.play().catch(()=>{if(button)button.classList.remove('playing')})} function renderList(){list.innerHTML=WORDS.map((w,i)=>`<button class="word-item ${i===current?'active':''}" data-i="${i}" aria-label="Open and listen to ${w.word}"><strong>${w.word}<span class="inline-speaker" aria-hidden="true">🔊</span></strong><span>${w.type} · ${w.pos}</span></button>`).join('');list.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=+b.dataset.i;setMode('card');playWord(WORDS[current],document.getElementById('speak'))})}
function mark(w){if(!state.missed.includes(w.word))state.missed.push(w.word);update()}
function card(){const w=WORDS[current];root.innerHTML=`<div class="meta"><span class="pill">${w.type}</span><span class="pill">${current+1} / ${WORDS.length}</span></div><div class="word-heading"><h2 class="word">${w.word}</h2><button class="speak" id="speak" type="button" aria-label="Listen to ${w.word}">🔊 Listen</button></div><div class="pos">${w.pos}</div><p class="definition">${w.definition}</p>${w.chinese?`<p class="chinese">${w.chinese}</p>`:''}<p class="example">${w.example}</p><div class="controls"><button class="secondary" id="prev">Previous</button><button class="primary" id="next">Next Word</button><button class="secondary" id="miss">Mark for Review</button></div>`;document.getElementById('prev').onclick=()=>{current=(current-1+WORDS.length)%WORDS.length;renderList();card()};document.getElementById('next').onclick=()=>{current=(current+1)%WORDS.length;renderList();card()};document.getElementById('miss').onclick=()=>mark(w);document.getElementById('speak').onclick=e=>playWord(w,e.currentTarget);update()}
const FALLBACKS={n:['an idea','a place','a person','a tool','a change','a group'],v:['look','make','find','help','move','use'],adj:['small','strong','ready','special','different','careful'],adv:['slowly','outside','together','again','today','nearby'],prep:['at school','after lunch','with care','near the door','before class','under a table'],pron:['someone else','all of us','one thing','each person','both of them','the others'],phrase:['at first','for now','in the end','one at a time','in this way','as a team']};
function posClass(pos){pos=pos.toLowerCase();if(pos.startsWith('n.'))return'n';if(pos.startsWith('v.'))return'v';if(pos.startsWith('adj'))return'adj';if(pos.startsWith('adv'))return'adv';if(pos.startsWith('prep'))return'prep';if(pos.startsWith('pron'))return'pron';return'phrase'}
function distractors(w,field){const seen=new Set([w[field]]),out=[];let pool;if(field==='word'){const kind=posClass(w.pos);pool=[...shuffle(WORDS.filter(x=>x.word!==w.word&&posClass(x.pos)===kind).map(x=>x.word)),...shuffle(FALLBACKS[kind]||FALLBACKS.phrase)]}else{pool=shuffle(WORDS.filter(x=>x.word!==w.word).map(x=>x.definition))}for(const value of pool){if(!seen.has(value)){seen.add(value);out.push(value)}if(out.length===3)break}return out}
function showChoice(value,isCloze,w){if(isCloze&&w.cloze.trim().startsWith('_____'))return value.charAt(0).toUpperCase()+value.slice(1);return value}
function question(kind){if(quiz>=WORDS.length)quiz=0;const w=WORDS[quiz],isCloze=kind==='cloze',correct=isCloze?w.word:w.definition,choices=shuffle([correct,...distractors(w,isCloze?'word':'definition')]),correctIndex=choices.indexOf(correct);root.innerHTML=`<div class="meta"><span class="pill">${w.type}</span><span class="pill">${quiz+1} / ${WORDS.length}</span></div><p class="question">${isCloze?w.cloze.replace('_____','<span class="blank">_____</span>'):`<strong>${w.word}</strong> means...`}</p>${isCloze?`<p class="clue">Meaning clue: ${w.definition}</p>`:''}<div class="options">${choices.map((c,i)=>`<button class="opt" data-i="${i}">${showChoice(c,isCloze,w)}</button>`).join('')}</div><div class="status" id="status"></div>`;root.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{root.querySelectorAll('.opt').forEach(x=>x.disabled=true);state.tried++;if(+b.dataset.i===correctIndex){state.correct++;b.classList.add('correct');document.getElementById('status').textContent=`Correct. ${w.example}`}else{b.classList.add('wrong');root.querySelectorAll('.opt')[correctIndex].classList.add('correct');mark(w);document.getElementById('status').textContent=`Review: ${w.word}`}update();setTimeout(()=>{quiz++;question(kind)},1200)});update()}
function missed(){const words=state.missed.map(name=>WORDS.find(w=>w.word===name)).filter(Boolean);root.innerHTML=words.length?`<p class="question">Missed Words</p><div class="word-list" style="max-height:none;padding:0">${words.map(w=>`<div class="word-item"><strong>${w.word}</strong><span>${w.definition}</span><span>${w.example}</span></div>`).join('')}</div><div class="controls"><button class="secondary" id="clear">Clear Missed Words</button></div>`:`<p class="question">No missed words yet.</p><p class="example">Try Choose Meaning or Fill the Blank. Words answered incorrectly will appear here.</p>`;if(document.getElementById('clear'))document.getElementById('clear').onclick=()=>{state.missed=[];update();missed()};update()}
function render(){renderList();if(mode==='card')card();if(mode==='meaning')question('meaning');if(mode==='cloze')question('cloze');if(mode==='missed')missed()} function setMode(next){mode=next;quiz=0;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));render()}
document.querySelectorAll('.mode[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));render();
document.getElementById('resetProgress').onclick=()=>{if(confirm('Reset all progress and missed words for this task card?')){state={correct:0,tried:0,missed:[]};current=0;quiz=0;setMode('card')}};
</script></body></html>
